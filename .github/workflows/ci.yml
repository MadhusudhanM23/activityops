name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the secret scan covers every commit
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Secret scan (tracked files and full history)
        run: node scripts/scan-secrets.mjs --history
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t activityops-app:ci .
      - name: Refuses to boot without a password
        run: |
          if docker run --rm activityops-app:ci; then
            echo "container started without DEMO_PASSWORD"; exit 1
          fi
      - name: Boots and serves health with a password
        run: |
          docker run -d --name aops -e DEMO_PASSWORD=ci-only-password-123 -p 8080:8080 activityops-app:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/api/health && exit 0; sleep 1; done
          docker logs aops; exit 1
